name: AdaLink AutoFix

on:
  workflow_run:
    workflows: ["Build AdaLink"]
    types: [completed]

permissions:
  actions: write
  contents: read

jobs:
  diagnostico:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest

    steps:
      - name: Ler erro
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view ${{ github.event.workflow_run.id }} --log-failed > erro.txt

      - name: Guardar diagnóstico
        uses: actions/upload-artifact@v4
        with:
          name: AdaLink-Diagnostico
          path: erro.txt

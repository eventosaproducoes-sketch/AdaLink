name: AdaLink AutoFix

on:
  workflow_run:
    workflows: ["Build AdaLink"]
    types: [completed]

permissions:
  actions: read
  contents: read

jobs:
  diagnostico:
    if: ${{ github.event.workflow_run.conclusion == 'failure' }}
    runs-on: ubuntu-latest
    steps:
      - name: Ler erro
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh run view ${{ github.event.workflow_run.id }} --log-failed | tail -n 80
